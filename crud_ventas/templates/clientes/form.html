{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<div class="card"><div class="card-body">
  <form method="post" novalidate>
    <div class="row g-3">
      <div class="col-md-8">
        <label for="nombre_cliente" class="form-label">Nombre del cliente *</label>
        <input type="text" class="form-control" id="nombre_cliente" name="nombre_cliente"
               maxlength="100" required value="{{ item.nombre_cliente or '' }}">
      </div>
      <div class="col-md-4">
        <label for="ciudad" class="form-label">Ciudad *</label>
        <input type="text" class="form-control" id="ciudad" name="ciudad"
               maxlength="60" required value="{{ item.ciudad or '' }}">
      </div>
      <div class="col-md-4">
        <label for="segmento" class="form-label">Segmento *</label>
        <select class="form-select" id="segmento" name="segmento" required>
          <option value="">Seleccione…</option>
          {% for s in segmentos %}
            <option value="{{ s }}" {{ 'selected' if item.segmento == s }}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-8">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email"
               maxlength="120" value="{{ item.email or '' }}">
      </div>
    </div>
    {{ m.botones_form(url_for('clientes.listar')) }}
  </form>
</div></div>
{% endblock %}
